[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ggpa"
dynamic = ["version"]
description = "Generative Gibbs for Physics-Aware Sampling"
readme = "README.md"
license = "MIT"
authors = [{ name = "Weizhou Wang" }]
keywords = ["diffusion models", "sampling", "replica exchange", "statistical physics", "mcmc"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "numpy>=1.26",
  "PyYAML>=6",
]

[project.optional-dependencies]
md = ["openmm>=8.1", "mdtraj>=1.10"]
figures = ["matplotlib>=3.8", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["ggpa*"]

[tool.setuptools.dynamic]
version = {attr = "ggpa.__version__"}

